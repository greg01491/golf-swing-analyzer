name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: backend
        run: pip install -e ".[pose,packaging]"
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run backend:build
      - working-directory: frontend
        run: npx electron-builder --publish never
      - name: Verify updater artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem "frontend/release/Golf-Swing-Analyzer-Setup-*.exe" -File
          $blockmap = Get-ChildItem "frontend/release/Golf-Swing-Analyzer-Setup-*.exe.blockmap" -File
          $latest = "frontend/release/latest.yml"
          if (-not $installer) { throw "Installer was not produced" }
          if (-not $blockmap) { throw "Installer blockmap was not produced" }
          if (-not (Test-Path $latest)) { throw "latest.yml was not produced" }
          Write-Host "Installer: $($installer.FullName) ($($installer.Length) bytes)"
          Write-Host "Blockmap: $($blockmap.FullName) ($($blockmap.Length) bytes)"
          Write-Host "Updater manifest: $latest"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/release/*.exe
            frontend/release/*.blockmap
            frontend/release/latest.yml
          generate_release_notes: true
