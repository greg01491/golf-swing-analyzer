# Golf Swing Analyzer — runtime configuration
# All values here are user-editable; nothing in this list should be hardcoded
# elsewhere in the app (spec.md NFR4).

audio_trigger:
  # Mic device index to listen on. null = system default input, but that can
  # fail outright on some machines (seen: MME default erroring with "no
  # driver installed" even though the hardware itself worked fine via a
  # specific device index). Run `python -m golf_sim.audio.cli devices` to
  # list candidates and set an explicit index -- WASAPI-backed entries are
  # the most reliable bet on Windows.
  # Stable host API + device name. If it is unavailable, startup automatically
  # falls back to the first usable WASAPI input instead of trusting a stale
  # Windows device index.
  device: "Windows WASAPI:Microphone Array (AMD Audio Device)"
  # RMS/dB trigger threshold. TBD via calibration helper (Phase 2).
  threshold_db: -20
  # Seconds of footage to keep *before* the trigger in the saved clip.
  # 1.5s so the clip reliably includes the address/start of the swing, not
  # just from mid-backswing (the impact sound is the trigger, and a full
  # swing's backswing takes longer than 1s).
  pre_capture_delay_s: 1.5
  # Fixed length of the saved clip, counted from (trigger - pre_capture_delay_s).
  capture_duration_s: 3
  # Ignore re-triggers for this many seconds after a capture starts.
  trigger_cooldown_s: 5

cameras:
  # Rolling buffer must cover at least capture_duration_s + this margin (not
  # just pre_capture_delay_s): it keeps accumulating post-trigger frames after
  # a trigger fires, so it must retain the whole window until extraction
  # finishes, not just the pre-trigger portion.
  buffer_margin_s: 1
  # camera_1 = down-the-line (behind golfer), camera_2 = face-on (side).
  # Selected by DirectShow device NAME, not index -- Windows shuffles camera
  # indices between processes (seen live: a swing recorded from the laptop
  # webcam because the rig camera's index moved). `id` is only the fallback
  # when no name is set. The laptop's own "HP True Vision FHD Camera" is
  # deliberately not used.
  # rotation_deg corrects a physically sideways/upside-down mounted camera
  # (0/90/180/270). Applied to every frame at capture time, not just the
  # preview -- a rotated person confuses the pose model, which expects
  # upright people, so this matters for real accuracy, not just display.
  devices:
  - id: 0
    name: PC Camera
    role: camera_1
    width: 1280
    height: 720
    fps: 120
    rotation_deg: 0
  - id: 2
    name: HD USB Camera
    role: camera_2
    width: 1280
    height: 720
    fps: 120
    rotation_deg: 270
pose:
  # Pose2Sim settings (spec.md §4.3; OQ2 resolved -- RTMPose via Pose2Sim).
  # pose_model 'Body_with_feet' = HALPE_26 keypoints, Pose2Sim's default.
  pose_model: Body_with_feet
  # RTMlib accuracy/speed tradeoff: lightweight / balanced / performance.
  mode: balanced
  # Write an overlay video per camera (landmarks drawn on frames) for QA.
  save_debug_video: true

calibration:
  # Directory holding the rig's calibration result (Calib*.toml, Pose2Sim
  # format) plus the source checkerboard footage it was computed from. The
  # rig is calibrated once and reused across sessions; recalibrate whenever
  # a camera moves (spec.md assumption).
  dir: config/calibration
  # Flag "recalibration recommended" if the calibration file is older than
  # this many days (cameras drift/get bumped over time).
  max_age_days: 60
  # Checkerboard used for calibration: inner-corner count [rows, cols] and
  # square size in mm. Matches the generated A4 board
  # (data/calibration_board_A4.png): 5x8 squares of 30mm = 4x7 inner corners.
  checkerboard_corners:
  - 4
  - 7
  checkerboard_square_size_mm: 28.4  # measured on Greg's print with a ruler
  # Straight-line distance between the two camera lenses in the current rig.
  camera_distance_m: 3.115

metrics:
  # Per-metric reference ranges; edit freely. Units in degrees unless noted.
  # Metrics without a range here are still computed, just never flagged.
  reference_ranges:
    shoulder_turn_deg: {min: 80, max: 100}
    hip_turn_deg: {min: 40, max: 55}
    spine_tilt_deg: {min: 25, max: 40}
    x_factor_deg: {min: 30, max: 45}
    tempo_ratio: {min: 2.8, max: 3.2}
    # Lateral hip sway as % of stance width, relative to address.
    hip_sway_top_pct: {min: 0, max: 30}
    hip_sway_impact_pct: {min: 0, max: 40}
    # Rotation & sequencing
    hip_rotation_impact_deg: {min: 30, max: 50}
    shoulder_tilt_impact_deg: {min: 25, max: 45}
    # Posture & stability (lower-is-better faults; range is the "acceptable" band)
    head_movement_cm: {min: 0, max: 10}
    spine_angle_change_deg: {min: 0, max: 10}
    early_extension_cm: {min: 0, max: 8}
    reverse_spine_deg: {min: 0, max: 12}
    # Body angles
    knee_flex_deg: {min: 145, max: 172}
    lead_arm_deg: {min: 160, max: 180}
  # Club length changes address posture and the size of the turn. These
  # profiles override only club-dependent metrics; tempo, X-factor and sway
  # continue to use the shared ranges above.
  club_profiles:
    driver:
      shoulder_turn_deg: {min: 85, max: 105}
      hip_turn_deg: {min: 40, max: 55}
      spine_tilt_deg: {min: 20, max: 35}
    fairway_wood:
      shoulder_turn_deg: {min: 82, max: 102}
      hip_turn_deg: {min: 38, max: 53}
      spine_tilt_deg: {min: 22, max: 37}
    long_iron:
      shoulder_turn_deg: {min: 80, max: 100}
      hip_turn_deg: {min: 37, max: 52}
      spine_tilt_deg: {min: 25, max: 40}
    mid_iron:
      shoulder_turn_deg: {min: 78, max: 98}
      hip_turn_deg: {min: 35, max: 50}
      spine_tilt_deg: {min: 28, max: 43}
    short_iron:
      shoulder_turn_deg: {min: 75, max: 95}
      hip_turn_deg: {min: 32, max: 48}
      spine_tilt_deg: {min: 32, max: 47}
    wedge:
      shoulder_turn_deg: {min: 70, max: 90}
      hip_turn_deg: {min: 30, max: 45}
      spine_tilt_deg: {min: 35, max: 50}
  club_profile_mapping:
    driver: driver
    3_wood: fairway_wood
    5_wood: fairway_wood
    3_iron: long_iron
    4_iron: long_iron
    5_iron: long_iron
    6_iron: mid_iron
    7_iron: mid_iron
    8_iron: short_iron
    9_iron: short_iron
    pitching_wedge: wedge
    gap_wedge: wedge
    sand_wedge: wedge
    lob_wedge: wedge

analysis:
  # Which arm is "lead" (nearer the target). Body-pose tracking alone can't
  # tell left-handed from right-handed golfers apart, and the P-system
  # checkpoints (P3/P5/P9 etc.) are defined relative to the lead arm.
  golfer_handedness: right

ball:
  # Coloured-ball detection is hue-based. The ball is yellow (measured hue
  # ~22-30); this range excludes skin/orange below and the green mat above.
  hue_min: 15
  hue_max: 42
  # Use the face-on camera for ball/club contact: the ball is clearer there.
  detection_camera_role: camera_2
  # In the front-on view the ball sits below the golfer's feet, so search from
  # the space between the legs instead of the wrists.
  detection_anchor: legs
  min_saturation: 50
  min_value: 50
  min_circularity: 0.4
  min_area_px: 20
  present_min_fraction: 0.1
  disappearance_confirm_frames: 2
  roi:
    x_min_offset: -140
    x_max_offset: 140
    y_min_offset: 100
    y_max_offset: 320

processing:
  # Automatically run the full analysis pipeline (2D pose -> 3D -> metrics ->
  # tips) on every capture, so results are waiting without pressing "process
  # swing" in the UI. Sessions process one at a time in the background;
  # capture keeps working while processing runs. Turn off to batch-process
  # later (e.g. if the machine struggles between shots).
  auto_process: true

storage:
  data_dir: data
  db_file: data/sessions.db

api:
  host: 127.0.0.1
  port: 8765

system_requirements:
  # Below "minimum" is flagged red in the system check -- capture/processing
  # will likely be too slow or unreliable. Below "recommended" still works
  # but may be sluggish under load.
  min_cpu_cores: 4
  recommended_cpu_cores: 8
  min_ram_gb: 8
  recommended_ram_gb: 16
  min_free_disk_gb: 5
  # Golf swings are fast -- a camera that can't sustain these gets motion
  # blur or drops the critical impact frame entirely.
  min_camera_width: 1280
  min_camera_height: 720
  min_camera_fps: 30
  # "close other applications" warning thresholds for current system load,
  # checked live (not just static hardware specs).
  high_cpu_load_pct: 70
  high_ram_used_pct: 80
